name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  call-integration-tests:
    name: Run Integration Tests
    uses: ./.github/workflows/ci_integration.yml
  call-static-analysis:
    name: Run Static Analysis
    uses: ./.github/workflows/ci_static-analysis.yaml
  call-tests:
    name: Run Tests
    uses: ./.github/workflows/ci_tests.yaml
    with:
      platforms: >-
        [{"os": "ubuntu-latest", "architecture": "x64", "runner": "codebuild-CryptoToolsCI-linux-aws-dynamodb-encryption-python-${{ github.run_id }}-${{ github.run_attempt }}"}]
  call-tests-macos-windows:
    name: Run Tests (macOS, Windows)
    uses: ./.github/workflows/ci_tests.yaml
    with:
      platforms: >-
        [{"os": "windows-latest", "architecture": "x64", "runner": "windows-latest"},
         {"os": "macos-latest", "architecture": "x64", "runner": "macos-latest"}]
      upstream: false
  pr-ci-all-required:
    if: always()
    needs:
      - call-integration-tests
      - call-static-analysis
      - call-tests
    runs-on: codebuild-CryptoToolsCI-linux-aws-dynamodb-encryption-python-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify all required jobs passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
