# This workflow runs tests on pull requests.
name: tests

on:
  workflow_call:
    inputs:
      platforms:
        type: string
        required: false
        default: >-
          [{"os": "ubuntu-latest", "architecture": "x64", "runner": "codebuild-CryptoToolsCI-linux-aws-dynamodb-encryption-python-${{ github.run_id }}-${{ github.run_attempt }}"},
           {"os": "windows-latest", "architecture": "x64", "runner": "windows-latest"},
           {"os": "macos-latest", "architecture": "x64", "runner": "macos-latest"}]
      upstream:
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
        python:
          - 3.8
          - 3.9
          - "3.10"
          - "3.11"
          - "3.12"
#          - 3.x  3.13 does not have 'pipes' and maybe other necessary things
        category:
          - local-slow
        exclude:
          # Python < 3.11 is broken on macOS runners due to missing libintl dependency
          # See: https://github.com/actions/setup-python/issues/875
          - platform:
              os: macos-latest
            python: 3.8
          - platform:
              os: macos-latest
            python: 3.9
          - platform:
              os: macos-latest
            python: "3.10"
# These require credentials.
# Enable them once we sort how to provide them.
#          - integ-slow
#          - examples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.platform.architecture }}
      - run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r dev_requirements/ci-requirements.txt
      - name: run test
        env:
          TOXENV: ${{ matrix.category }}
          # tox reads pip's output as UTF-8; Windows writes it in the console code page otherwise.
          PYTHONUTF8: "1"
        run: tox -- -vv

  upstream-py311:
    if: inputs.upstream != false
    runs-on: codebuild-CryptoToolsCI-linux-aws-dynamodb-encryption-python-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: true
      matrix:
        category:
          - nocmk
          - sourcebuildcheck
          - test-upstream-requirements-py311
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r dev_requirements/ci-requirements.txt
      - name: run test
        env:
          TOXENV: ${{ matrix.category }}
          # tox reads pip's output as UTF-8; Windows writes it in the console code page otherwise.
          PYTHONUTF8: "1"
        run: tox -- -vv
